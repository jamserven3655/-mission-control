<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control</title>
<meta name="theme-color" content="#05070d">
<meta name="description" content="James's HQ: bots, paper trading, wallets, money goal. Read-only data, plus a free rule-based coach.">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission Ctrl">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-startup-image" href="icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="icons/splash-1170x2532.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top glass">
  <div class="brand"><span class="dot ok"></span><b>MISSION</b>&nbsp;CONTROL</div>
  <div class="clock mono" id="clock">--</div>
</header>
<main id="app"><div class="loading mono">Booting<span class="blink">_</span></div></main>
<nav class="tabs glass" id="tabs">
  <button data-tab="hq" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg><span>HQ</span></button>
  <button data-tab="trade"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/></svg><span>Coins</span></button>
  <button data-tab="money"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 010 3h-3a1.5 1.5 0 000 3h4"/></svg><span>Money</span></button>
  <button data-tab="wallets"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h3"/></svg><span>Wallets</span></button>
  <button data-tab="usage"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 12l4-3"/></svg><span>Usage</span></button>
  <button data-tab="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/></svg><span>Coach</span></button>
  <button data-tab="waiting"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg><span>Waiting</span><i class="badge" id="wbadge"></i></button>
</nav>
<div id="sheet" class="sheet"></div>
<script src="coach.js"></script>
<script src="coach-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
